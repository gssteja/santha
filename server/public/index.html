<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santha</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      min-height: 100vh;
    }
    header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid #1e1e2a;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .install-santha {
      background: #e8b04b;
      color: #0d0d10;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 20px;
      padding: 8px 16px;
      white-space: nowrap;
    }
    .install-santha:active { background: #d49a30; }
    #apps-grid {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }
    .app-card {
      background: #16161f;
      border: 1px solid #1e1e2a;
      border-radius: 16px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      text-decoration: none;
      color: inherit;
    }
    .app-card:active { transform: scale(0.97); }
    .app-card:hover { border-color: #4a4a6a; }
    .app-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .app-name {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      color: #e8e8f0;
    }
    .app-ver {
      font-size: 11px;
      font-weight: 600;
      color: #8a8aa0;
      font-variant-numeric: tabular-nums;
    }
    .app-desc {
      font-size: 11px;
      color: #666;
      text-align: center;
      line-height: 1.4;
    }
    .install-btn {
      margin-top: 4px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .install-btn:active { background: #4338ca; }
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px 20px;
      color: #444;
    }
    .empty p { font-size: 14px; }
    .loading { color: #444; text-align: center; padding: 60px; }
  </style>
</head>
<body>
  <header>
    <h1>Santha</h1>
    <a id="install-santha" class="install-santha" style="display:none">Install Santha</a>
  </header>
  <div id="apps-grid">
    <div class="loading">Loading...</div>
  </div>

  <script>
    const ICONS = {
      workout: { emoji: '💪', bg: '#1a1a3a' },
      habit: { emoji: '✅', bg: '#0f2a1a' },
      timer: { emoji: '⏱️', bg: '#2a1a0f' },
      note: { emoji: '📝', bg: '#1a2a0f' },
      default: { emoji: '📱', bg: '#1e1e2a' }
    };

    function getIcon(id, meta) {
      const key = Object.keys(ICONS).find(k => id.includes(k) || (meta.category || '').includes(k)) || 'default';
      return ICONS[key];
    }

    async function loadApps() {
      const grid = document.getElementById('apps-grid');
      try {
        const res = await fetch('/api/apps');
        const all = await res.json();

        // Santha (the store itself) gets a dedicated header install button, not a grid card.
        const santha = all.find(a => a.id === 'santha');
        const btn = document.getElementById('install-santha');
        if (santha && santha.type === 'apk') {
          btn.href = santha.download || santha.url;
          btn.textContent = santha.version ? `Install Santha v${santha.version}` : 'Install Santha';
          btn.style.display = '';
        }

        const apps = all.filter(a => a.id !== 'santha');
        if (!apps.length) {
          grid.innerHTML = '<div class="empty"><p>No apps yet.<br>Ask Claude to build one.</p></div>';
          return;
        }
        grid.innerHTML = apps.map(app => {
          const icon = getIcon(app.id, app);
          const isApk = app.type === 'apk';
          const url = isApk ? (app.download || app.url) : app.url;
          const label = isApk ? 'Install' : 'Open';
          const ver = app.version ? `<div class="app-ver">v${app.version}</div>` : '';
          return `
            <div class="app-card" onclick="openApp('${url}')">
              <div class="app-icon" style="background:${icon.bg}">${app.icon || icon.emoji}</div>
              <div class="app-name">${app.name || app.id}</div>
              ${ver}
              <div class="app-desc">${app.description || ''}</div>
              <button class="install-btn" onclick="event.stopPropagation();openApp('${url}')">${label}</button>
            </div>`;
        }).join('');
      } catch (e) {
        grid.innerHTML = '<div class="empty"><p>Failed to load apps.</p></div>';
      }
    }

    function openApp(url) {
      window.location.href = url;
    }

    loadApps();
  </script>
</body>
</html>
