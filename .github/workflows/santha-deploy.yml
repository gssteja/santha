name: Santha — build & deploy

# Build the Santha store release APK (arm64) and publish it to the server so it can
# be downloaded/sideloaded (and self-listed in its own store).
# Triggers: manual "Run workflow" button, or pushing a tag like `santha-v1.0.1`
# (the part after `santha-v` becomes the store version).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Store version (e.g. 1.0.1)'
        required: true
        default: '1.0.1'
  push:
    tags:
      - 'santha-v*'

concurrency:
  group: santha-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/santha
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#santha-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building Santha $V"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/santha/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS deps
        run: npm ci

      - name: Install NDK 30
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "ndk;30.0.14904198"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.SANTHA_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build release APK
        env:
          SANTHA_KEYSTORE_PASSWORD: ${{ secrets.SANTHA_KEYSTORE_PASSWORD }}
          SANTHA_KEY_ALIAS: ${{ secrets.SANTHA_KEY_ALIAS }}
          SANTHA_KEY_PASSWORD: ${{ secrets.SANTHA_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          # Fresh node_modules (npm ci) lack the per-library codegen JNI dirs that the
          # CMake step expects; generate them first or configureCMake* fails with
          # "...source/codegen/jni/ which is not an existing directory".
          (cd android && ./gradlew generateCodegenArtifactsFromSchema --no-daemon)
          (cd android && ./gradlew assembleRelease --no-daemon \
            -PSANTHA_UPLOAD_STORE_FILE=release.keystore \
            -PSANTHA_UPLOAD_STORE_PASSWORD="$SANTHA_KEYSTORE_PASSWORD" \
            -PSANTHA_UPLOAD_KEY_ALIAS="$SANTHA_KEY_ALIAS" \
            -PSANTHA_UPLOAD_KEY_PASSWORD="$SANTHA_KEY_PASSWORD")

      - name: Publish to server
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          curl -fsS -X POST https://santha.t3ja.com/api/apk/santha \
            -H "x-api-key: ${{ secrets.SANTHA_API_KEY }}" \
            -F apk=@"$APK" \
            -F 'meta={"name":"Santha","description":"App store. Anni apps ikkade.","icon":"🏪","category":"system","version":"${{ steps.ver.outputs.version }}","id":"santha","type":"apk"}'
          echo "✓ Deployed Santha ${{ steps.ver.outputs.version }} — downloadable at https://santha.t3ja.com/apps/santha/app.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: santha-${{ steps.ver.outputs.version }}-apk
          path: apps/santha/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
