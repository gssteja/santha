name: Kasrat — build & deploy

# Build the Kasrat release APK (arm64) and publish it to the Santha store.
# Triggers: manual "Run workflow" button, or pushing a tag like `kasrat-v1.0.2`
# (the part after `kasrat-v` becomes the store version).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Store version (e.g. 1.0.2)'
        required: true
        default: '1.0.2'
  push:
    tags:
      - 'kasrat-v*'

concurrency:
  group: kasrat-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kasrat
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#kasrat-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building Kasrat $V"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/kasrat/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS deps
        run: npm ci

      - name: Install NDK 30
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "ndk;30.0.14904198"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KASRAT_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build release APK
        env:
          KASRAT_KEYSTORE_PASSWORD: ${{ secrets.KASRAT_KEYSTORE_PASSWORD }}
          KASRAT_KEY_ALIAS: ${{ secrets.KASRAT_KEY_ALIAS }}
          KASRAT_KEY_PASSWORD: ${{ secrets.KASRAT_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --no-daemon \
            -PKASRAT_UPLOAD_STORE_FILE=release.keystore \
            -PKASRAT_UPLOAD_STORE_PASSWORD="$KASRAT_KEYSTORE_PASSWORD" \
            -PKASRAT_UPLOAD_KEY_ALIAS="$KASRAT_KEY_ALIAS" \
            -PKASRAT_UPLOAD_KEY_PASSWORD="$KASRAT_KEY_PASSWORD")

      - name: Publish to Santha store
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          curl -fsS -X POST https://santha.t3ja.com/api/apk/kasrat \
            -H "x-api-key: ${{ secrets.SANTHA_API_KEY }}" \
            -F apk=@"$APK" \
            -F 'meta={"name":"Kasrat","description":"Workout. Noppulu vasthaayi.","icon":"🏋️","category":"workout","version":"${{ steps.ver.outputs.version }}","id":"kasrat","type":"apk"}'
          echo "✓ Deployed Kasrat ${{ steps.ver.outputs.version }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasrat-${{ steps.ver.outputs.version }}-apk
          path: apps/kasrat/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
