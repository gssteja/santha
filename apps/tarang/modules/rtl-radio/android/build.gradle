plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.santha.tarang'
version = '1.0.0'

def abis = (findProperty('reactNativeArchitectures') ?: 'arm64-v8a').split(',').collect { it.trim() }

android {
  namespace "expo.modules.rtlradio"
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '1.0.0'
    ndk {
      abiFilters(*abis)
    }
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_static"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
  lint {
    abortOnError false
  }
}

dependencies {
  // the plane map: GPU vector maps reading PMTiles from files. 13.0.x is the last release built with Kotlin 2.0
  // (React Native 0.79's compiler); 13.1+ needs Kotlin 2.2. The OpenGL ES build: the default one needs Vulkan, which
  // some phones and the emulator lack (it crashes when the map opens).
  implementation 'org.maplibre.gl:android-sdk-opengl:13.0.2'
  // the User-Agent OSM's tile policy asks for (the same OkHttp MapLibre already pulls in)
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
